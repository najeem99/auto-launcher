name: UAE fuel prices

# Keeps fuel-prices.json current. The app downloads that file to price fill-ups and trips.
on:
  schedule:
    - cron: '30 */6 * * *'   # every 6 hours; it only commits when the prices change
  workflow_dispatch:
  push:
    branches: ['claude/project-thread-ajkyms']
    paths: ['tools/fuel_prices.py', '.github/workflows/fuel-prices.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        run: python3 tools/fuel_prices.py fuel-prices.json
      - name: Test the Global Petrol Prices fallback
        if: github.event_name == 'push'
        run: python3 -c "import sys; sys.path.insert(0,'tools'); import fuel_prices as f, datetime as d; t=d.date.today(); print('GPP:', f.from_global_petrol_prices(t.year, t.month)); import re; [print(k, [x[:300] for x in re.findall(r'The current.{0,250}', f.text(f.get('https://www.globalpetrolprices.com/United-Arab-Emirates/%s_prices/' % k)))[:2]]) for k in ('gasoline','diesel')]"
      - name: Commit if changed
        if: github.event_name != 'push'
        run: |
          if git diff --quiet fuel-prices.json; then echo "No change"; exit 0; fi
          git config user.name "fuel-prices-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update UAE fuel prices" fuel-prices.json
          git push
      - name: Show result
        run: cat fuel-prices.json
