name: Align dua words
on:
  push:
    branches: [tools-dua-align]
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install faster-whisper==1.1.1 requests
      - run: python tools/align_dua.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tools/dua_words.json
          git commit -m "Dua word timings"
          git push
